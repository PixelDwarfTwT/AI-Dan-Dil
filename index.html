<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f2eb" />
    <meta name="description" content="A birthday surprise made just for Aidil." />
    <title>Happy Birthday, Aidil</title>
    <link rel="preload" as="image" href="aidil-birthday.png?v=5" />
    <link rel="stylesheet" href="app.css?v=5" />
    <script src="app.js?v=5" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="index.html?v=5" aria-label="Aidil's birthday home">A little surprise</a>
      <nav class="page-nav" aria-label="Birthday pages">
        <a href="index.html?v=5" aria-current="page">Home</a>
        <a href="note.html?v=5">Birthday note</a>
      </nav>
      <button class="music-toggle" id="music-toggle" type="button" aria-label="Play birthday song" aria-pressed="false">
        <span class="music-label">Play the birthday song</span>
      </button>
    </header>

    <main id="top">
      <section class="hero page-wrap" aria-labelledby="birthday-title">
        <div class="hero-copy">
          <p class="eyebrow">Today is your day</p>
          <h1 id="birthday-title">It's your day,<br /><span>Aidil.</span></h1>
          <p class="hero-intro">Hope the year ahead brings good people, big laughs, and plenty of cake.</p>
          <a class="primary-link" href="note.html?v=5">Read your birthday note</a>
        </div>
        <figure class="hero-art">
          <img src="aidil-birthday.png?v=5" alt="A birthday cake with soft sage and cream frosting and candles" width="1536" height="1024" />
        </figure>
      </section>
    </main>

    <footer class="footer page-wrap">
      <span>Happy birthday, Aidil</span>
      <span>Here's to a brilliant year ahead.</span>
    </footer>

    <audio id="birthday-song" src="hbd.mp3" preload="none" loop></audio>
  </body>
</html>
