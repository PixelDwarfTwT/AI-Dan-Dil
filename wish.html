<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f2eb" />
    <meta name="description" content="Make a birthday wish for Aidil." />
    <title>Make a Wish, Aidil</title>
    <link rel="preload" as="image" href="aidil-birthday.png?v=4" />
    <link rel="stylesheet" href="app.css?v=4" />
    <script src="app.js?v=4" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="index.html?v=4" aria-label="Aidil's birthday home">A little surprise</a>
      <nav class="page-nav" aria-label="Birthday pages">
        <a href="index.html?v=4">Home</a>
        <a href="note.html?v=4">Birthday note</a>
        <a href="wish.html?v=4" aria-current="page">Make a wish</a>
      </nav>
      <button class="music-toggle" id="music-toggle" type="button" aria-label="Play birthday song" aria-pressed="false">
        <span class="music-label">Play the birthday song</span>
      </button>
    </header>

    <main class="wish-page page-wrap">
      <section class="wish-layout" aria-labelledby="wish-title">
        <div class="wish-copy">
          <p class="eyebrow">A moment for you</p>
          <h1 id="wish-title">Make a wish,<br /><span>Aidil.</span></h1>
          <p class="hero-intro">Take a quiet moment, think of something good, and make it yours.</p>
          <button class="wish-button" id="wish-button" type="button">Make a wish</button>
          <p class="wish-status" id="wish-status" aria-live="polite" aria-atomic="true"></p>
        </div>
        <figure class="wish-art">
          <img src="aidil-birthday.png?v=4" alt="A birthday cake with soft sage and cream frosting and candles" width="1536" height="1024" />
        </figure>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
      </section>
    </main>

    <footer class="footer page-wrap">
      <span>Happy birthday, Aidil</span>
      <span>Here's to a brilliant year ahead.</span>
    </footer>

    <audio id="birthday-song" src="hbd.mp3" preload="none" loop></audio>
  </body>
</html>
